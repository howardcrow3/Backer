name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    strategy:
      matrix:
        os: [macos-14, ubuntu-latest, windows-latest]   # macos-14 is Apple silicon
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        shell: bash
        run: |
          set +e
          cargo test --workspace --no-fail-fast 2>&1 | tee out.txt
          code=${PIPESTATUS[0]}
          # Surface failures as annotations so they show up without opening the raw log.
          grep -E "FAILED|panicked|^error" out.txt | head -25 | while IFS= read -r l; do echo "::error::${l//%/%25}"; done
          exit $code
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: ./scripts/check-crate-graph.sh
        shell: bash
  dmg:
    # Apple-silicon .dmg. Signed and notarized when the Apple secrets exist; otherwise ad hoc signed.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: ". -> target\napp/src-tauri -> target" }
      - name: Export Apple secrets (only if all are set; empty variables would make Tauri try to notarize)
        env:
          S_CERT: ${{ secrets.APPLE_CERTIFICATE }}
          S_CERT_PW: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          S_ID: ${{ secrets.APPLE_ID }}
          S_PW: ${{ secrets.APPLE_PASSWORD }}
          S_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$S_CERT" ] && [ -n "$S_CERT_PW" ] && [ -n "$S_ID" ] && [ -n "$S_PW" ] && [ -n "$S_TEAM" ]; then
            { echo "APPLE_CERTIFICATE=$S_CERT"; echo "APPLE_CERTIFICATE_PASSWORD=$S_CERT_PW"; echo "APPLE_ID=$S_ID"; echo "APPLE_PASSWORD=$S_PW"; echo "APPLE_TEAM_ID=$S_TEAM"; } >> "$GITHUB_ENV"
            echo "SIGNED=1" >> "$GITHUB_ENV"
          fi
      - name: Import Developer ID certificate
        if: env.SIGNED == '1'
        run: |
          KC="$RUNNER_TEMP/build.keychain-db"; KP="$(uuidgen)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KP" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KP" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$KP" "$KC"
          security list-keychains -d user -s "$KC" login.keychain-db
          ID=$(security find-identity -v -p codesigning "$KC" | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.*)".*/\1/')
          echo "APPLE_SIGNING_IDENTITY=$ID" >> "$GITHUB_ENV"
      - name: Ad hoc signing (no Apple secrets)
        if: env.SIGNED != '1'
        run: echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
      - run: cargo build --release -p backer-agent
      - name: Sign and bundle the agent
        run: |
          mkdir -p app/src-tauri/binaries
          B=app/src-tauri/binaries/backer-agent-aarch64-apple-darwin
          cp target/release/backer-agent "$B"
          if [ "$APPLE_SIGNING_IDENTITY" = "-" ]; then codesign --force --sign - "$B"
          else codesign --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$B"; fi
      - run: cargo install tauri-cli --version "^2" --locked
      - run: cd app/src-tauri && cargo tauri icon ../icon-source.png
      - run: cd app/src-tauri && cargo test tray_dot
      - run: cd app/src-tauri && cargo tauri build --target aarch64-apple-darwin --bundles app,dmg
      - name: Verify
        run: |
          APP=$(ls -d target/aarch64-apple-darwin/release/bundle/macos/*.app app/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app 2>/dev/null | head -1)
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv "$APP" 2>&1 | grep -E "Authority|TeamIdentifier|flags" || true
          if [ "$SIGNED" = "1" ]; then spctl --assess --type execute --verbose "$APP"; xcrun stapler validate "$APP" || true; fi
      - name: Collect
        run: |
          mkdir out
          cp app/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg out/ || cp target/aarch64-apple-darwin/release/bundle/dmg/*.dmg out/
      - uses: actions/upload-artifact@v4
        with:
          name: Backer-macOS-arm64-dmg
          path: out/*.dmg

  windows:
    # Unsigned installer for 64-bit Windows. SmartScreen will warn until it is signed.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: ". -> target\napp/src-tauri -> target" }
      - run: cargo build --release -p backer-agent
      - name: Bundle the agent next to the app
        shell: bash
        run: |
          mkdir -p app/src-tauri/binaries
          cp target/release/backer-agent.exe app/src-tauri/binaries/backer-agent-x86_64-pc-windows-msvc.exe
      - run: cargo install tauri-cli --version "^2" --locked
      - run: cargo tauri icon ../icon-source.png
        working-directory: app/src-tauri
      - run: cargo tauri build --bundles nsis
        working-directory: app/src-tauri
      - uses: actions/upload-artifact@v4
        with:
          name: Backer-Windows-x64-installer
          path: app/src-tauri/target/release/bundle/nsis/*.exe
