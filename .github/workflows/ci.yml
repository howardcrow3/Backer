name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [macos-14, ubuntu-latest]   # macos-14 is Apple silicon
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: ./scripts/check-crate-graph.sh
  app:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p nasbak-agent
      - run: cargo install tauri-cli --version "^2" --locked
      - run: cd app/src-tauri && cargo tauri icon ../icon-source.png || true
      - run: cd app/src-tauri && cargo tauri build --no-bundle
