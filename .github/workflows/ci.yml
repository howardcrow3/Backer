name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish a release with this tag (e.g. v0.1.0); leave empty to only build'
        required: false
jobs:
  test:
    strategy:
      matrix:
        os: [macos-15, ubuntu-latest, windows-latest]   # macos-15 is Apple silicon
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        shell: bash
        run: |
          set +e
          cargo test --workspace --no-fail-fast 2>&1 | tee out.txt
          code=${PIPESTATUS[0]}
          # Surface failures as annotations so they show up without opening the raw log.
          grep -E "FAILED|panicked|^error" out.txt | head -25 | while IFS= read -r l; do echo "::error::${l//%/%25}"; done
          exit $code
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: UI unit tests
        shell: bash
        run: node --test app/ui/tests/*.test.mjs
      - run: ./scripts/check-crate-graph.sh
        shell: bash
  nas-integration:
    # Connector and end-to-end backup tests against real SFTP (OpenSSH), SMB (Samba 4.23) and NFS
    # (kernel nfsd) servers in containers. Runs on every push, pull request and build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Start test servers
        run: |
          scripts/nas-test-servers.sh up | tee "$RUNNER_TEMP/nas.env"
          grep -q BACKER_TEST_NFS "$RUNNER_TEMP/nas.env" && echo "NAS_REQUIRE=sftp,smb,nfs" >> "$GITHUB_ENV" || echo "NAS_REQUIRE=sftp,smb" >> "$GITHUB_ENV"
          sed -e "s/^export //" -e "s/'//g" "$RUNNER_TEMP/nas.env" >> "$GITHUB_ENV"
      - name: Connector and end-to-end tests
        run: BACKER_REQUIRE_SERVERS="$NAS_REQUIRE" cargo test -p backer-connector -p backer-agent --no-fail-fast -- --nocapture
      - name: Server logs
        if: failure()
        run: for c in backer-sftp backer-smb backer-nfs; do echo "== $c"; docker logs $c 2>&1 | tail -50 || true; done
      - run: scripts/nas-test-servers.sh down
        if: always()
  dmg:
    needs: [test, nas-integration]   # never build an installer from code whose tests fail
    # Apple-silicon .dmg. Signed and notarized when the Apple secrets exist; otherwise ad hoc signed.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: ". -> target\napp/src-tauri -> target" }
      - name: Export Apple secrets (only if all are set; empty variables would make Tauri try to notarize)
        env:
          S_CERT: ${{ secrets.APPLE_CERTIFICATE }}
          S_CERT_PW: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          S_ID: ${{ secrets.APPLE_ID }}
          S_PW: ${{ secrets.APPLE_PASSWORD }}
          S_TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$S_CERT" ] && [ -n "$S_CERT_PW" ] && [ -n "$S_ID" ] && [ -n "$S_PW" ] && [ -n "$S_TEAM" ]; then
            { echo "APPLE_CERTIFICATE=$S_CERT"; echo "APPLE_CERTIFICATE_PASSWORD=$S_CERT_PW"; echo "APPLE_ID=$S_ID"; echo "APPLE_PASSWORD=$S_PW"; echo "APPLE_TEAM_ID=$S_TEAM"; } >> "$GITHUB_ENV"
            echo "SIGNED=1" >> "$GITHUB_ENV"
          fi
      - name: Import Developer ID certificate
        if: env.SIGNED == '1'
        run: |
          KC="$RUNNER_TEMP/build.keychain-db"; KP="$(uuidgen)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KP" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KP" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          # The .p12 may only carry an older certificate for the same key. The Developer ID certificate is public,
          # so it is kept in the repo and imported here; it pairs with the key by its public key.
          security import .github/signing/developer-id.cer -k "$KC" -A
          security set-key-partition-list -S apple-tool:,apple: -k "$KP" "$KC"
          security list-keychains -d user -s "$KC" login.keychain-db
          ID=$(security find-identity -p codesigning "$KC" | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.*)".*/\1/')
          if [ -z "$ID" ]; then
            ALL=$(security find-identity -v "$KC" | sed 's/"/'"'"'/g' | tr '\n' ';')
            ALLP=$(security find-identity "$KC" | sed 's/"/'"'"'/g' | tr '\n' ';')
            echo "::error::No usable Developer ID Application identity in the imported .p12. Valid identities: $ALL | All (incl. untrusted/unpaired): $ALLP"
            exit 1
          fi
          echo "APPLE_SIGNING_IDENTITY=$ID" >> "$GITHUB_ENV"
      - name: Ad hoc signing (no Apple secrets)
        if: env.SIGNED != '1'
        run: echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
      - name: Set the app version from the release tag
        shell: bash
        env:
          TAG: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}
        run: |
          if [ -n "$TAG" ]; then
            V="${TAG#v}"
            python3 - "$V" <<'PY'
          import json, sys
          p = "app/src-tauri/tauri.conf.json"
          c = json.load(open(p)); c["version"] = sys.argv[1]
          json.dump(c, open(p, "w"), indent=2)
          PY
            echo "Building version $V"
          fi
      - run: cargo build --release -p backer-agent
      - name: Sign and bundle the agent
        run: |
          mkdir -p app/src-tauri/binaries
          B=app/src-tauri/binaries/backer-agent-aarch64-apple-darwin
          cp target/release/backer-agent "$B"
          if [ "$APPLE_SIGNING_IDENTITY" = "-" ]; then codesign --force --sign - "$B"
          else codesign --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" "$B"; fi
      - run: cargo install tauri-cli --version "^2" --locked
      - run: cd app/src-tauri && cargo tauri icon ../icon-source.png
      - run: cd app/src-tauri && cargo test tray_dot
      - name: Build the app (and notarize when signed)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          cd app/src-tauri
          set +e
          # Update packages are signed with the updater key; without it, build only the installer.
          CFG=(); [ -z "$TAURI_SIGNING_PRIVATE_KEY" ] && CFG=(--config '{"bundle":{"createUpdaterArtifacts":false}}')
          # The certificate is already in our keychain; if Tauri imported the secret itself it would not see the Developer ID certificate.
          env -u APPLE_CERTIFICATE -u APPLE_CERTIFICATE_PASSWORD cargo tauri build "${CFG[@]}" --target aarch64-apple-darwin --bundles app,dmg 2>&1 | tee "$RUNNER_TEMP/tauri.log"
          RC=${PIPESTATUS[0]}
          if [ "$RC" != "0" ]; then
            echo "::error::tauri build failed: $(tail -n 25 "$RUNNER_TEMP/tauri.log" | tr '\n' '|' | cut -c1-3000)"
            exit "$RC"
          fi
      - name: Verify
        run: |
          APP=$(ls -d target/aarch64-apple-darwin/release/bundle/macos/*.app app/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app 2>/dev/null | head -1)
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv "$APP" 2>&1 | grep -E "Authority|TeamIdentifier|flags" || true
          if [ "$SIGNED" = "1" ]; then spctl --assess --type execute --verbose "$APP"; xcrun stapler validate "$APP" || true; fi
      - name: Collect
        run: |
          mkdir out
          cp app/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg out/ || cp target/aarch64-apple-darwin/release/bundle/dmg/*.dmg out/
          # Update package and its signature (only present when the updater key is set).
          cp app/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz* out/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: Backer-macOS-arm64-dmg
          path: out/*

  windows:
    needs: [test, nas-integration]
    # Unsigned installer for 64-bit Windows. SmartScreen will warn until it is signed.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: ". -> target\napp/src-tauri -> target" }
      - name: Set the app version from the release tag
        shell: bash
        env:
          TAG: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}
        run: |
          if [ -n "$TAG" ]; then
            V="${TAG#v}"
            python3 - "$V" <<'PY'
          import json, sys
          p = "app/src-tauri/tauri.conf.json"
          c = json.load(open(p)); c["version"] = sys.argv[1]
          json.dump(c, open(p, "w"), indent=2)
          PY
            echo "Building version $V"
          fi
      - run: cargo build --release -p backer-agent
      - name: Bundle the agent next to the app
        shell: bash
        run: |
          mkdir -p app/src-tauri/binaries
          cp target/release/backer-agent.exe app/src-tauri/binaries/backer-agent-x86_64-pc-windows-msvc.exe
      - run: cargo install tauri-cli --version "^2" --locked
      - run: cargo tauri icon ../icon-source.png
        working-directory: app/src-tauri
      - name: Build the installer
        shell: bash
        working-directory: app/src-tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          CFG=(); [ -z "$TAURI_SIGNING_PRIVATE_KEY" ] && CFG=(--config '{"bundle":{"createUpdaterArtifacts":false}}')
          cargo tauri build "${CFG[@]}" --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: Backer-Windows-x64-installer
          path: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            app/src-tauri/target/release/bundle/nsis/*.exe.sig

  release:
    # Runs for a pushed v* tag, or a manual run with release_tag set: publishes the installers as a GitHub release.
    if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
    needs: [dmg, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write   # lets the release job sign in to AWS without stored keys
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          TAG="${{ inputs.release_tag || github.ref_name }}"
          gh release create "$TAG" dist/* --repo "${{ github.repository }}" --target "${{ github.sha }}" \
            --title "Backer $TAG" --generate-notes
      - name: Point the README at this build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.release_tag || github.ref_name }}"
          git fetch origin main
          git checkout -B main origin/main
          ./scripts/update-readme-downloads.sh "$TAG" "${{ github.repository }}" dist
          if git diff --quiet README.md; then echo "README already up to date"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update download links for $TAG"
          git push origin main
      - name: Publish the update feed (only when the AWS settings exist)
        env:
          BUCKET: ${{ vars.UPDATE_S3_BUCKET }}
          BASE_URL: ${{ vars.UPDATE_BASE_URL }}
          ROLE: ${{ secrets.AWS_UPDATE_ROLE_ARN }}
        run: |
          if [ -z "$BUCKET" ] || [ -z "$BASE_URL" ] || [ -z "$ROLE" ]; then echo "Update feed not configured; skipping."; echo "FEED=0" >> "$GITHUB_ENV"; exit 0; fi
          echo "FEED=1" >> "$GITHUB_ENV"
      - uses: aws-actions/configure-aws-credentials@v4
        if: env.FEED == '1'
        with:
          role-to-assume: ${{ secrets.AWS_UPDATE_ROLE_ARN }}
          aws-region: ${{ vars.UPDATE_AWS_REGION || 'us-west-2' }}
      - name: Upload packages and latest.json
        if: env.FEED == '1'
        env:
          BUCKET: ${{ vars.UPDATE_S3_BUCKET }}
          BASE_URL: ${{ vars.UPDATE_BASE_URL }}
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.release_tag || github.ref_name }}"; V="${TAG#v}"
          MAC=$(ls dist/*.app.tar.gz | head -1); WIN=$(ls dist/*-setup.exe | head -1)
          [ -f "$MAC.sig" ] && [ -f "$WIN.sig" ] || { echo "::error::Update signatures missing: set TAURI_SIGNING_PRIVATE_KEY"; exit 1; }
          BASE="${BASE_URL%/}/$V"
          NOTES=$(gh release view "$TAG" --repo "${{ github.repository }}" --json body -q .body 2>/dev/null | head -c 4000 || true)
          python3 - "$V" "$BASE" "$MAC" "$WIN" "$NOTES" <<'PY'
          import json, sys, os, datetime
          v, base, mac, win, notes = sys.argv[1:6]
          sig = lambda f: open(f + ".sig").read().strip()
          m = {"version": v, "notes": notes, "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
               "platforms": {"darwin-aarch64": {"signature": sig(mac), "url": f"{base}/{os.path.basename(mac)}"},
                             "windows-x86_64": {"signature": sig(win), "url": f"{base}/{os.path.basename(win)}"}}}
          json.dump(m, open("latest.json", "w"), indent=2)
          PY
          # Packages first (never overwritten), then the feed that points at them.
          aws s3 cp "$MAC" "s3://$BUCKET/backer/$V/" --cache-control "public,max-age=31536000,immutable"
          aws s3 cp "$WIN" "s3://$BUCKET/backer/$V/" --cache-control "public,max-age=31536000,immutable"
          # Installers for the download page: a versioned copy, and fixed names that always point at the newest release.
          DMG=$(ls dist/*.dmg | head -1)
          aws s3 cp "$DMG" "s3://$BUCKET/backer/$V/" --cache-control "public,max-age=31536000,immutable"
          aws s3 cp "$DMG" "s3://$BUCKET/backer/download/Backer-macOS-arm64.dmg" --cache-control "no-cache"
          aws s3 cp "$WIN" "s3://$BUCKET/backer/download/Backer-Windows-x64-setup.exe" --cache-control "no-cache"
          aws s3 cp latest.json "s3://$BUCKET/backer/latest.json" --cache-control "no-cache" --content-type application/json
