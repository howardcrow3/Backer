name: Update hosting setup (AWS, run by hand)

# Creates (or updates) the AWS pieces that serve app updates: a private S3 bucket behind CloudFront and the role
# the release job assumes. Safe to re-run; it never deletes anything. Run it from the Actions tab on main.
#
# Secrets used:
#   AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY  Temporary setup keys (same ones the highturtle setup workflows use).
#                                              Delete them after a successful run.
#   REPO_ADMIN_TOKEN (optional)                A fine-grained token for this repository with "Variables" and
#                                              "Secrets" read/write. When present the workflow also sets
#                                              UPDATE_BASE_URL, UPDATE_S3_BUCKET, UPDATE_AWS_REGION and
#                                              AWS_UPDATE_ROLE_ARN for you. Without it the values are printed
#                                              in the run summary for you to paste into Settings.

on:
  workflow_dispatch:
    inputs:
      region:
        description: AWS region for the bucket and stack
        required: false
        default: us-east-2

permissions:
  contents: read

jobs:
  setup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      REGION: ${{ inputs.region }}
      STACK: backer-updates
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ inputs.region }}
      - name: Deploy the stack
        run: |
          set -euo pipefail
          # An account can have only one GitHub OIDC provider; reuse it when it already exists.
          ARN=$(aws iam list-open-id-connect-providers --query "OpenIDConnectProviderList[?contains(Arn,'token.actions.githubusercontent.com')].Arn | [0]" --output text)
          PARAMS=(GitHubRepo=${{ github.repository }})
          if [ -n "$ARN" ] && [ "$ARN" != "None" ]; then
            echo "Reusing existing OIDC provider $ARN"
            PARAMS+=(CreateGitHubOidcProvider=false "ExistingOidcProviderArn=$ARN")
          fi
          aws cloudformation deploy --stack-name "$STACK" --template-file tools/update-hosting/template.yaml \
            --capabilities CAPABILITY_IAM --no-fail-on-empty-changeset --parameter-overrides "${PARAMS[@]}"
      - name: Read the outputs
        id: out
        run: |
          set -euo pipefail
          get() { aws cloudformation describe-stacks --stack-name "$STACK" --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" --output text; }
          echo "bucket=$(get BucketName)" >> "$GITHUB_OUTPUT"
          echo "base=$(get BaseUrl)" >> "$GITHUB_OUTPUT"
          echo "role=$(get RoleArn)" >> "$GITHUB_OUTPUT"
      - name: Smoke test (CloudFront answers, bucket stays private)
        run: |
          set -u
          code=$(curl -s -o /dev/null -w '%{http_code}' "${{ steps.out.outputs.base }}/latest.json" || true)
          # 403/404 is expected before the first release uploads latest.json; 000 would mean no answer.
          echo "latest.json -> HTTP $code"
          direct=$(curl -s -o /dev/null -w '%{http_code}' "https://${{ steps.out.outputs.bucket }}.s3.$REGION.amazonaws.com/backer/latest.json" || true)
          echo "bucket direct -> HTTP $direct (must not be 200)"
          [ "$direct" != "200" ]
      - name: Set the repository variables and secret (needs REPO_ADMIN_TOKEN)
        env:
          GH_TOKEN: ${{ secrets.REPO_ADMIN_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "REPO_ADMIN_TOKEN not set; paste the values from the summary into Settings."; exit 0; fi
          R=${{ github.repository }}
          gh variable set UPDATE_S3_BUCKET --repo "$R" --body "${{ steps.out.outputs.bucket }}"
          gh variable set UPDATE_BASE_URL --repo "$R" --body "${{ steps.out.outputs.base }}"
          gh variable set UPDATE_AWS_REGION --repo "$R" --body "$REGION"
          gh secret set AWS_UPDATE_ROLE_ARN --repo "$R" --body "${{ steps.out.outputs.role }}"
          echo "SET=1" >> "$GITHUB_ENV"
      - name: Summary
        run: |
          {
            echo "## Update hosting is ready"
            echo
            echo "| Setting | Where | Value |"
            echo "|---|---|---|"
            echo "| \`UPDATE_S3_BUCKET\` | variable | \`${{ steps.out.outputs.bucket }}\` |"
            echo "| \`UPDATE_BASE_URL\` | variable | \`${{ steps.out.outputs.base }}\` |"
            echo "| \`UPDATE_AWS_REGION\` | variable | \`$REGION\` |"
            echo "| \`AWS_UPDATE_ROLE_ARN\` | secret | \`${{ steps.out.outputs.role }}\` |"
            echo
            if [ "${SET:-0}" = "1" ]; then echo "These were set on the repository for you."; else echo "Add them under Settings, Secrets and variables, Actions. The next release then publishes the update feed."; fi
            echo
            echo "Update address the app will use: \`${{ steps.out.outputs.base }}/latest.json\`"
          } >> "$GITHUB_STEP_SUMMARY"
