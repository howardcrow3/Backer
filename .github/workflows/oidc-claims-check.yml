name: OIDC claims check (temporary)
on: workflow_dispatch
permissions:
  contents: read
  id-token: write
jobs:
  claims:
    runs-on: ubuntu-latest
    steps:
      - name: Print the non-secret OIDC claims this repository's tokens carry
        run: |
          T=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | python3 -c 'import sys,json;print(json.load(sys.stdin)["value"])')
          python3 - "$T" <<'PY'
          import sys,base64,json
          p=sys.argv[1].split(".")[1]; p+="="*(-len(p)%4)
          c=json.loads(base64.urlsafe_b64decode(p))
          for k in ("iss","aud","sub","repository","ref","job_workflow_ref","event_name","environment"):
              print(k,"=",c.get(k))
          PY
