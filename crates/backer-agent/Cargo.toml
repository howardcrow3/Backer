[package]
name = "backer-agent"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
backer-core.workspace = true
backer-store.workspace = true
backer-connector.workspace = true
backer-engine.workspace = true
backer-sched.workspace = true
backer-mcp.workspace = true
backer-removal.workspace = true
backer-restore.workspace = true
backer-license.workspace = true
keyring = { version = "3", features = ["apple-native", "windows-native"] }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
jiff.workspace = true
getrandom.workspace = true
# Plain blocking HTTPS for license activation (rustls, bundled root certificates).
ureq = { version = "2", default-features = false, features = ["tls"] }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

[dev-dependencies]
tempfile.workspace = true
backer-license = { workspace = true, features = ["issue"] }
tokio.workspace = true
nfs3_server = { version = "0.11", features = ["memfs"] }
