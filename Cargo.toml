[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
jiff = "0.2"
walkdir = "2"
unicode-normalization = "0.1"
tempfile = "3"
libc = "0.2"
getrandom = "0.3"
windows-sys = { version = "0.59", features = ["Win32_System_Power"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
backer-core = { path = "crates/backer-core" }
backer-store = { path = "crates/backer-store" }
backer-connector = { path = "crates/backer-connector" }
backer-engine = { path = "crates/backer-engine" }
backer-sched = { path = "crates/backer-sched" }
backer-mcp = { path = "crates/backer-mcp" }
backer-removal = { path = "crates/backer-removal" }
