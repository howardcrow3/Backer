[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
jiff = "0.2"
walkdir = "2"
unicode-normalization = "0.1"
tempfile = "3"
libc = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
nasbak-core = { path = "crates/nasbak-core" }
nasbak-store = { path = "crates/nasbak-store" }
nasbak-connector = { path = "crates/nasbak-connector" }
nasbak-engine = { path = "crates/nasbak-engine" }
nasbak-sched = { path = "crates/nasbak-sched" }
nasbak-mcp = { path = "crates/nasbak-mcp" }
nasbak-removal = { path = "crates/nasbak-removal" }
