<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Backer</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="turtlebox-ui/tokens.css">
<link rel="stylesheet" href="turtlebox-ui/base.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <nav aria-label="Sections">
    <a class="brand" href="#jobs" data-home aria-label="Backer home"><img src="assets/app-icon.svg" alt=""><span>Backer</span></a>
    <a href="#jobs" data-v="jobs">Jobs</a>
    <a href="#deleted" data-v="deleted">Deleted files <span id="badge" class="badge" hidden></span></a>
    <div class="grow"></div>
    <div class="acct-wrap">
      <div id="menu" class="pop" role="menu" hidden>
        <div class="who-line" id="agent">Checking…</div>
        <div id="trial" class="lic" hidden></div>
        <div class="grp">Settings</div>
        <div id="sections"></div>
        <a href="#feedback" id="fb-nav" role="menuitem" hidden>Send feedback</a>
        <hr>
        <div class="theme" role="group" aria-label="Theme">
          <button data-theme-set="system" aria-pressed="true">System</button><button data-theme-set="light" aria-pressed="false">Light</button><button data-theme-set="dark" aria-pressed="false">Dark</button>
        </div>
      </div>
      <button id="acct" class="acct" aria-haspopup="menu" aria-expanded="false"><span class="av" aria-hidden="true">B</span><span class="who"><span class="n">Backer</span><span class="s" id="pill-lic"></span></span></button>
    </div>
  </nav>
  <main id="main"></main>
</div>
<dialog id="dlg"></dialog>
<script src="nas.js"></script>
<script src="integrity.js"></script>
<script src="app.js"></script>
<script src="feedback.js"></script>
</body>
</html>
